name: Terraform

on:
  push:
    branches: [main]
    paths:
      - terraform/google/**
      - .github/workflows/terraform.yml
  pull_request:
    paths:
      - terraform/google/**
      - .github/workflows/terraform.yml

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        working-directory: terraform/google

    env:
      TF_VAR_database_url:               ${{ secrets.DATABASE_URL }}
      TF_VAR_redis_url:                  ${{ secrets.REDIS_URL }}
      TF_VAR_openai_api_key:             ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_store_api_key:              ${{ secrets.STORE_API_KEY }}
      TF_VAR_supabase_url:               ${{ secrets.SUPABASE_URL }}
      TF_VAR_supabase_service_role_key:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_supabase_jwt_secret:        ${{ secrets.SUPABASE_JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init

      - name: Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
